name: Bug report
description: Report a reproducible problem with the extension
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Extension and browser version
      placeholder: "BookMind Next 0.3.1; Chrome 130"
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Site and feature
      placeholder: "Bilibili favorite capture"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Remove private URLs, account details, and saved content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
